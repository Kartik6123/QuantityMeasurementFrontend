<!-- ============================================================
     pages/login.html — Login page component
     QuantaConvert | UI-only build (localStorage)
     Included via: index.html
     ============================================================ -->

<div id="page-login" style="display:none">
  <div class="auth-page">

    <!-- ── Left decorative panel ── -->
    <div class="auth-panel">
      <div class="panel-content">
        <div class="panel-logo">
          <i class="fa-solid fa-scale-balanced"></i>
        </div>
        <h1 class="panel-title">Quanta<br/>Convert</h1>
        <p class="panel-sub">
          Precision unit conversion for length, weight,
          temperature &amp; volume.
        </p>
        <div class="panel-features">
          <div class="feat">
            <div class="feat-icon"><i class="fa-solid fa-ruler"></i></div>
            <span>Length — ft, in, yd, cm</span>
          </div>
          <div class="feat">
            <div class="feat-icon"><i class="fa-solid fa-weight-scale"></i></div>
            <span>Weight — kg, g, lb</span>
          </div>
          <div class="feat">
            <div class="feat-icon"><i class="fa-solid fa-temperature-half"></i></div>
            <span>Temperature — °C, °F, K</span>
          </div>
          <div class="feat">
            <div class="feat-icon"><i class="fa-solid fa-flask"></i></div>
            <span>Volume — L, mL, gal</span>
          </div>
        </div>
      </div>
      <div class="panel-orb panel-orb-1"></div>
      <div class="panel-orb panel-orb-2"></div>
    </div>

    <!-- ── Right form ── -->
    <div class="auth-form-wrap">
      <div class="auth-card">

        <div class="auth-card-header">
          <h2 class="auth-heading">Welcome back</h2>
          <p class="auth-caption">Sign in to continue converting</p>
        </div>

        <div class="form-field">
          <label class="field-label">
            <i class="fa-regular fa-envelope"></i> Email
          </label>
          <input
            class="field-input"
            id="login-email"
            type="email"
            placeholder="you@example.com"
          />
        </div>

        <div class="form-field">
          <label class="field-label">
            <i class="fa-solid fa-lock"></i> Password
          </label>
          <input
            class="field-input"
            id="login-password"
            type="password"
            placeholder="••••••••"
          />
        </div>

        <!-- Error message -->
        <div class="error-msg" id="login-error" style="display:none">
          <i class="fa-solid fa-circle-exclamation"></i>
          <span id="login-error-text"></span>
        </div>

        <button class="btn-primary" onclick="Auth.login()">
          Sign in <i class="fa-solid fa-arrow-right"></i>
        </button>

        <div class="divider"><span>or continue with</span></div>

        <button class="btn-google" onclick="Auth.demoLogin()">
          <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Demo — Sign in with Google
        </button>

        <p class="auth-switch">
          Don't have an account?
          <a class="auth-link" onclick="Router.goToSignup()">Create one</a>
        </p>

      </div>
    </div>

  </div>
</div>
